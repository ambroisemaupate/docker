[default]
user = core
group = core
listen = /var/run/php-fpm.sock
listen.owner = core
pm = ondemand
pm.max_children = 50
pm.max_requests = 500
pm.process_idle_timeout = 10s

catch_workers_output = yes
slowlog = /dev/stderr

; CVE-2026-109618 and CVE-2026-109619 mitigations, cannot be overridden by PHP_VALUE
php_admin_value[memory_limit] = -1
php_admin_flag[session.upload_progress.enabled] = off

include = /data/config/php-*.conf
