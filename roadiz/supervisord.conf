[program:cron]
command = cron -f -L 15
autostart=true
autorestart=true
[program:nginx]
command=nginx

[program:nginx-config]
command=bash -c "while inotifywait -e create,delete,modify,move -q /data/config/; do supervisorctl restart nginx; done"

[program:php-fpm]
command = php-fpm --fpm-config /usr/local/etc/php-fpm.conf
stdout_logfile = /data/logs/php-fpm.log
stderr_logfile = /data/logs/php-fpm.log
